<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>補給公路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：第三人稱追車畫面全螢幕，左上車況與距離、下方左右閃避鍵與中間干擾器；單一深色主題 */
:root{
  --bg:#101214; --panel:rgba(12,14,16,.66); --line:rgba(255,255,255,.35); --fg:#ffffff; --mut:#c9cdd1;
  --amber:#ffb23e; --red:#ff4d3d; --green:#6fdc8c; --blue:#7cc4ff;
  --f:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:700;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
button{font-family:var(--f);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:#8a8d92;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none}
#tl{top:10px;left:12px;padding:8px 12px;background:var(--panel);border-radius:6px;display:flex;flex-direction:column;gap:5px;min-width:200px}
#tl .lv{font-size:15px;color:var(--amber)}
#tl .row{display:flex;align-items:center;gap:8px;font-size:15px}
#hp{display:flex;gap:4px}
#hp i{width:22px;height:12px;background:var(--green);border-radius:2px}
#hp i.off{background:rgba(255,255,255,.18)}
#hp.low i{background:var(--red)}
.track{flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;min-width:90px}
.track b{display:block;height:100%;width:0;background:#fff}
#dist{font-size:15px;font-variant-numeric:tabular-nums}
#pauseB{position:absolute;top:10px;right:12px;min-width:64px;min-height:44px;font-size:16px;font-weight:900;color:#fff;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.mk{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--red);border-radius:2px}.mk::after{content:attr(data-l);position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-size:13px;font-weight:900;color:var(--red);text-shadow:0 1px 0 #000}.mk.fb{border-color:#f2eedc}.mk.fb::after{color:#f2eedc}
#warn{top:16%;left:0;right:0;text-align:center;font-size:clamp(26px,5.4vw,44px);font-weight:900;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.7)}
#warn.red{color:var(--red)} #warn.amb{color:var(--amber)} #warn.grn{color:var(--green)} #warn.blu{color:var(--blue)}
/* 進入新路段的提示：縮成上方中央的小標籤，不擋住前方道路 */
#seg{top:8px;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:max(210px,calc(100% - 460px));display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 14px;background:rgba(12,14,16,.78);border:1px solid rgba(255,255,255,.3);border-radius:8px;text-align:center}#seg b{font-size:20px;font-weight:900;color:#fff;line-height:1.3}#seg span{font-size:14px;color:#e6e2d6;line-height:1.35;text-wrap:balance}
@media (orientation:landscape) and (max-height:480px){#warn{top:30%;font-size:24px}#seg b{font-size:17px}#seg span{font-size:12px}}
@media (orientation:portrait){#seg{top:96px;max-width:calc(100% - 24px)}#warn{top:26%}}
.track.cg b{background:var(--green)}.track.cg b.mid{background:var(--amber)}.track.cg b.low{background:var(--red)}#cargoN{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
#ctl{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.steer{pointer-events:auto;width:clamp(96px,18vw,130px);height:clamp(96px,18vw,130px);border-radius:50%;background:rgba(12,14,16,.55);border:3px solid rgba(255,255,255,.85);color:#fff;font-size:20px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
.steer svg{width:42%;height:42%}
.steer.on{background:rgba(255,255,255,.85);color:#111}
#jam{pointer-events:auto;position:relative;min-width:150px;min-height:62px;padding:6px 14px;font-size:19px;font-weight:900;color:#111;background:var(--blue);border:2px solid var(--blue);border-radius:8px;overflow:hidden;line-height:1.2}
#jam small{display:block;font-size:12px;font-weight:700}
#jam:disabled{color:#fff;background:rgba(12,14,16,.6);border-color:rgba(255,255,255,.4)}
#jamCd{position:absolute;left:0;bottom:0;height:4px;background:var(--blue);width:0}
#rot{bottom:calc(150px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:14px;color:var(--mut);text-shadow:0 1px 0 #000}
.ov{position:absolute;inset:0;background:rgba(8,9,10,.8);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.card{width:min(100%,640px);max-height:100%;overflow-y:auto;background:#17191c;border:1px solid #3a3e43;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:36px;font-weight:900;line-height:1.15}
.card h2{margin:0;font-size:28px;font-weight:900;line-height:1.2}
.card .tag{font-size:14px;color:var(--amber);letter-spacing:.1em}
.card p{margin:0;font-size:17px;line-height:1.65}
.card .mut{color:var(--mut);font-size:14px}
.lvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lvb{min-height:86px;padding:8px;text-align:left;color:#fff;background:#24272b;border:1px solid #454a50;border-radius:8px;display:flex;flex-direction:column;gap:3px}
.lvb b{font-size:18px;font-weight:900}
.lvb span{font-size:13px;color:var(--mut);font-weight:700;line-height:1.4}
.lvb em{font-style:normal;font-size:12px;color:var(--green)}
.how{margin:0;padding:10px 12px 10px 30px;background:#24272b;border-radius:8px;display:flex;flex-direction:column;gap:5px;font-size:15px;line-height:1.55}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;min-height:56px;font-size:18px;font-weight:900;color:#111;background:#fff;border:2px solid #fff;border-radius:8px}
.btn.dark{color:#fff;background:transparent;border-color:#5a5f66}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:#24272b;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.stats span{font-size:13px;color:var(--mut)}
.stats b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.lesson{background:rgba(111,220,140,.12);border:1px solid rgba(111,220,140,.45);border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.6}
.know{border-top:1px solid #3a3e43;padding-top:10px;display:flex;flex-direction:column;gap:6px}
.know b{font-size:13px;color:var(--amber);letter-spacing:.1em}
.know p{font-size:15px}
.know a{font-size:12px;font-weight:500;color:var(--mut);line-height:1.5;word-break:break-word}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:18px;line-height:1.6;background:#111;z-index:9}
@media (orientation:portrait){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lvs{grid-template-columns:1fr}.lvb{min-height:64px}}
@media (orientation:landscape){#rot{display:none}}

/* 警示放左側、路段提示放右側：中間的道路與天空留給無人機 */
#warn{top:96px;left:12px;right:auto;transform:none;max-width:min(34%,300px);text-align:left;font-size:clamp(18px,2.4vw,26px);line-height:1.3;padding:6px 12px;background:rgba(12,14,16,.62);border-radius:8px}
#warn:empty{display:none}
#seg{top:62px;right:12px;left:auto;transform:none;width:auto;max-width:min(34%,300px);align-items:flex-end;text-align:right}
#seg span{text-align:right}
@media (orientation:landscape) and (max-height:480px){#warn{top:104px;font-size:17px;padding:4px 10px}#seg{top:60px;padding:4px 10px}#seg b{font-size:16px}#seg span{font-size:12px}}
@media (orientation:portrait){#warn{top:172px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);text-align:center;font-size:20px}#seg{top:96px;left:50%;right:auto;transform:translateX(-50%);max-width:calc(100% - 24px);align-items:center;text-align:center}#seg span{text-align:center}}
</style>

</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tl" class="hud">
    <div class="row"><span>補給</span><div class="track cg"><b id="cargoB" style="width:100%"></b></div><b id="cargoN">100%</b></div>
    <div class="row"><span id="dist">距離前線陣地</span></div>
    <div class="row"><div class="track"><b id="prog"></b></div></div>
  </div>
  <button id="pauseB" type="button">暫停</button>
  <div id="marks" class="hud" style="inset:0"></div>
  <div id="warn" class="hud"></div>
  <div id="seg" class="hud" hidden><b id="segT"></b><span id="segS"></span></div>
  <div id="rot" class="hud">把手機橫放，視野更寬</div>
  <div id="ctl">
    <button id="bL" class="steer" type="button" aria-label="向左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 4L7 12l8 8"/></svg>左</button>
    <button id="jam" type="button">干擾器<small id="jamT">準備好了</small><span id="jamCd"></span></button>
    <button id="bR" class="steer" type="button" aria-label="向右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 4l8 8-8 8"/></svg>右</button>
  </div>
  <div id="ov" class="ov"><div id="card" class="card" role="dialog" aria-modal="true"></div></div>
  <div id="err" hidden>畫面載入失敗。請改用手機內建的 Chrome 或 Safari 開啟，或稍後再試。</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').hidden=false;return}
let R;try{R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});}catch(e){$('err').hidden=false;return}
const coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
R.setPixelRatio(Math.min(window.devicePixelRatio||1,coarse?1.6:2));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const V=THREE.Vector3;
const S=new THREE.Scene();const FOG=0x8d9096;S.background=new THREE.Color(FOG);S.fog=new THREE.Fog(FOG,40,240);
const cam=new THREE.PerspectiveCamera(55,16/9,.1,400);

/* ---------- 共用工具（沿用 FPV 遊戲） ---------- */
let seed=7;function srnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function sr(a,b){return a+srnd()*(b-a)}
function rnd(a,b){return a+Math.random()*(b-a)}
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function speck(g,w,h,n,a){for(let i=0;i<n;i++){const v=Math.random()<.5?0:255;g.fillStyle='rgba('+v+','+v+','+v+','+(a*Math.random())+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}}
const asph=tex(512,512,(g,w,h)=>{g.fillStyle='#3d3f44';g.fillRect(0,0,w,h);speck(g,w,h,45000,.2);g.strokeStyle='rgba(18,18,20,.7)';g.lineWidth=1.5;for(let i=0;i<14;i++){g.beginPath();let x=rnd(0,w),y=rnd(0,h);g.moveTo(x,y);for(let k=0;k<7;k++){x+=rnd(-30,30);y+=rnd(-30,30);g.lineTo(x,y)}g.stroke()}g.fillStyle='rgba(20,22,26,.35)';for(let i=0;i<8;i++){g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(20,50),0,7);g.fill()}},[15,50]);
const brick=tex(256,256,(g,w,h)=>{g.fillStyle='#8a8278';g.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=0;c<10;c++){const o=r%2?14:0,v=rnd(-16,16);g.fillStyle='rgb('+(132+v)+','+(104+v)+','+(92+v)+')';g.fillRect(c*30-o+1,r*16+1,28,14)}speck(g,w,h,7000,.25);g.fillStyle='rgba(30,30,30,.22)';for(let i=0;i<5;i++)g.fillRect(rnd(0,w),0,rnd(4,14),h)});
const plaster=tex(256,256,(g,w,h)=>{g.fillStyle='#a7a49c';g.fillRect(0,0,w,h);speck(g,w,h,16000,.2);g.fillStyle='rgba(40,40,40,.18)';for(let i=0;i<6;i++)g.fillRect(rnd(0,w),0,rnd(3,10),h);g.fillStyle='rgba(60,55,50,.2)';for(let i=0;i<10;i++){g.beginPath();g.arc(rnd(0,w),rnd(0,h),rnd(6,22),0,7);g.fill()}});
const tile=tex(256,256,(g,w,h)=>{g.fillStyle='#8c8a85';g.fillRect(0,0,w,h);speck(g,w,h,12000,.2);g.strokeStyle='rgba(30,30,30,.4)';for(let i=0;i<=8;i++){g.beginPath();g.moveTo(0,i*32);g.lineTo(w,i*32);g.stroke();g.beginPath();g.moveTo(i*32,0);g.lineTo(i*32,h);g.stroke()}});
function radial(stops){return tex(64,64,(g,w,h)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,w,h)})}
const fireTex=radial([[0,'rgba(255,252,225,1)'],[.3,'rgba(255,190,80,.95)'],[.62,'rgba(220,80,20,.5)'],[1,'rgba(0,0,0,0)']]);
const glowTex=radial([[0,'rgba(255,255,255,1)'],[.3,'rgba(255,255,255,.6)'],[1,'rgba(255,255,255,0)']]);
const smokeTex=tex(64,64,(g,w,h)=>{for(let i=0;i<9;i++){const x=rnd(18,46),y=rnd(18,46),r=rnd(10,18);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}});
const netTex=tex(128,128,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='rgba(28,30,26,.18)';g.fillRect(0,0,w,h);g.strokeStyle='rgba(22,24,20,.9)';g.lineWidth=2.2;for(let i=0;i<=w;i+=16){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke()}});
function fixUV(geo,dims,k){const uv=geo.attributes.uv;const ox=Math.random(),oy=Math.random();for(let i=0;i<uv.count;i++){let su=k,sv=k;if(dims){const f=Math.floor(i/4);const d=f<2?[dims[2],dims[1]]:(f<4?[dims[0],dims[2]]:[dims[0],dims[1]]);su=d[0]*k;sv=d[1]*k}uv.setXY(i,uv.getX(i)*su+ox,uv.getY(i)*sv+oy)}uv.needsUpdate=true;return geo}
function box(w,h,d,k){return fixUV(new THREE.BoxGeometry(w,h,d),[w,h,d],k||.3)}
function merge(list){let n=0,ni=0;list.forEach(g=>{n+=g.attributes.position.count;ni+=g.index?g.index.count:g.attributes.position.count});const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2),idx=new Uint32Array(ni);let o=0,oi=0;list.forEach(g=>{const c=g.attributes.position.count;pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);if(g.index){const ia=g.index.array;for(let i=0;i<ia.length;i++)idx[oi+i]=ia[i]+o;oi+=ia.length}else{for(let i=0;i<c;i++)idx[oi+i]=o+i;oi+=c}o+=c});const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(pos,3));G.setAttribute('normal',new THREE.BufferAttribute(nor,3));G.setAttribute('uv',new THREE.BufferAttribute(uv,2));G.setIndex(new THREE.BufferAttribute(idx,1));G.computeBoundingSphere();return G}
function P(geo,mat,parent){const m=new THREE.Mesh(geo,mat);parent.add(m);return m}
const std=o=>new THREE.MeshStandardMaterial(o);
const mBrick=std({map:brick,roughness:.95}),mPlas=std({map:plaster,roughness:.95}),mIn=std({color:0x151412,roughness:1}),mGlass=std({color:0x7f8f99,transparent:true,opacity:.35,roughness:.15,metalness:.6}),mCon=std({color:0x8d8b86,roughness:1}),mWalk=std({map:tile,roughness:1}),mTrunk=std({color:0x3e3328,roughness:1}),mLeaf=std({color:0x46562f,roughness:.95,flatShading:true}),mPole=std({color:0x4a4d50,roughness:.6,metalness:.5}),mLine=std({color:0xd8d6cc,roughness:.8}),mYel=std({color:0xc9a43a,roughness:.8}),mDark=std({color:0x222322,roughness:.9}),mBurn=std({color:0x2c2622,roughness:.95,metalness:.2}),mRust=std({color:0x5d4331,roughness:.9,metalness:.3});
function bakeTo(src,dst){src.updateMatrixWorld(true);const bk=new Map();src.traverse(o=>{if(o.isMesh){if(!bk.has(o.material))bk.set(o.material,[]);bk.get(o.material).push(o.geometry.clone().applyMatrix4(o.matrixWorld))}});bk.forEach((list,mat)=>{const m=new THREE.Mesh(merge(list),mat);m.castShadow=mat!==mGlass;m.receiveShadow=true;dst.add(m)})}
function building(G,cx,cz,BW,BD,floors,mat,ruined){
  const FH=3,HH=floors*FH,ww=1.2,wh=1.5,sill=.9,t=.35;
  P(box(BW-.5,HH,BD-.5),mIn,G).position.set(cx,HH/2,cz);
  [[BW,0,BD/2,0],[BW,0,-BD/2,Math.PI],[BD,BW/2,0,Math.PI/2],[BD,-BW/2,0,-Math.PI/2]].forEach(f=>{
    const L=f[0],g=new THREE.Group();g.position.set(cx+f[1],0,cz+f[2]);g.rotation.y=f[3];G.add(g);
    const nc=Math.max(2,Math.round(L/(ww+1.4))),sp=L/nc;const cs=[];for(let i=0;i<nc;i++)cs.push(-L/2+sp*(i+.5));
    for(let i=0;i<=nc;i++){const l=i===0?-L/2:cs[i-1]+ww/2,r=i===nc?L/2:cs[i]-ww/2;if(r-l>.02)P(box(r-l,HH,t,.25),mat,g).position.set((l+r)/2,HH/2,0)}
    P(box(L,sill,t,.25),mat,g).position.set(0,sill/2,0);
    for(let k=0;k<floors;k++){const y0=k*FH+sill+wh,y1=Math.min((k+1)*FH+sill,HH);if(y1>y0)P(box(L,y1-y0,t,.25),mat,g).position.set(0,(y0+y1)/2,0);
      P(box(L,.09,.24),mCon,g).position.set(0,k*FH+sill-.02,.2);
      if(srnd()<.3){const x=cs[Math.floor(srnd()*nc)];P(new THREE.PlaneGeometry(ww*sr(.4,1),wh*sr(.5,1)),mGlass,g).position.set(x,k*FH+sill+wh/2,-.12)}}
    P(box(L+.3,.45,t+.25),mCon,g).position.set(0,HH+.22,0)});
  P(box(BW,.2,BD),mCon,G).position.set(cx,HH+.1,cz);
  if(ruined){for(let i=0;i<5;i++){const r=P(box(sr(.6,2),sr(.4,1.4),sr(.6,2)),mCon,G);r.position.set(cx+sr(-BW/3,BW/3),HH+.5,cz+sr(-BD/3,BD/3));r.rotation.set(sr(0,.5),sr(0,3),sr(0,.5))}}

function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(window.__cap)dt=Math.min(dt,window.__cap);step(dt);render()}
const now=()=>performance.now();
const FOGC=new THREE.Color(0x8d9096),FOGT=new THREE.Color(0x17181a),fogTmp=new THREE.Color();
function step(dt){
  if(state==='play'||state==='end'){
    clock+=dt;const live=state==='play',prog=Math.min(1,cs/GOAL);
    const target=live?steer*9:0;vx+=Math.max(-28*dt,Math.min(28*dt,target-vx));
    if(scrapeT>0)scrapeT-=dt;
    vCur=L.v*(1+.18*prog)*(scrapeT>0?.85:1)*(live?1:.25);
    const k=kAt(cs);cx+=(vx-k*vCur*vCur*L.drift*(live?1:0))*dt;
    if(Math.abs(cx)>XMAX){cx=Math.sign(cx)*XMAX;if(vx*cx>0)vx=0;if(live&&scrapeT<=0){scrapeT=.8;stat.scrape++;shake=.25;showWarn('擦撞路邊！減速','amb',.8)}if(clock-lastSpark>.12){lastSpark=clock;puff(toW(cx+Math.sign(cx)*1,.4,cs,new V()),0xb0aea8)}}
    cs+=vCur*dt;placeCar();
    body.rotation.y=-vx*.03;body.rotation.z=vx*.012+k*vCur*vCur*.004;wheels.forEach(w=>w.rotation.x-=vCur*dt/.42);
    if(live){
      const f=1-.25*prog,bio=biomeAt(cs+vCur*2.6);
      if(clock>=nextSpawn&&!blocked(cs+vCur*L.ft)){spawnDrone(Math.random()<L.fiber);if(Math.random()<L.pair)pend.push({t:clock+.9,f:Math.random()<L.fiber});if(Math.random()<L.triple)pend.push({t:clock+1.7,f:Math.random()<L.fiber});nextSpawn=clock+rnd(L.every[0]*f,L.every[1]*f)*(bio==='field'||bio==='bridge'?1.25:1)/1.6}
      for(let i=pend.length-1;i>=0;i--)if(clock>=pend[i].t){spawnDrone(pend[i].f);pend.splice(i,1)}
      if(nextArt===0)nextArt=clock+4;
      if(clock>=nextArt&&cs>650){if(salvo())nextArt=clock+(bio==='city'?rnd(10,13):rnd(5,7));else nextArt=clock+1}
      OBS.forEach(o=>{const wdt=o.k==='wreck'?1.9:o.k==='crater'?2.1:2.2;if(!o.hit&&Math.abs(cs-o.s)<2.6&&Math.abs(cx-o.x)<wdt){o.hit=true;if(o.k!=='crater'){o.g.position.add(new V(rnd(-1,1),0,rnd(-1,1)));o.g.rotation.y+=.6}boom(toW(cx,.8,cs+2,new V()),false);damage('obs')}});
      // 路段標題
      let si=0;L.segs.forEach((g,i)=>{if(cs>=g[0])si=i});if(si!==segI){segI=si;segT=2.6;$('segT').textContent=L.segs[si][1];$('segS').textContent=L.segs[si][2];$('seg').hidden=false}
      if(segT>0){segT-=dt;if(segT<=0)$('seg').hidden=true}
      if(cs>=GOAL){state='end';const rid=RUN;setTimeout(()=>{if(rid===RUN&&state==='end')result()},500)}
    }
    stepDrones(dt,now()/1000);stepArt(dt);updateSlots(cs);
    // 隧道裡變暗
    const tin=Math.max(0,Math.min(1,Math.min(cs-TUN[0]+10,TUN[1]-cs+10)/30));tunF+=(tin-tunF)*Math.min(1,dt*3);
    hemi.intensity=.85*(1-.72*tunF);sun.intensity=.75*(1-.9*tunF);fogTmp.copy(FOGC).lerp(FOGT,tunF);S.fog.color.copy(fogTmp);S.background.copy(fogTmp);rain.visible=tunF<.5;
    tHurt+=dt;if(cargo<70&&tHurt>(cargo<35?.12:.3)){tHurt=0;puff(toW(cx+rnd(-.4,.4),1.5,cs-2.2,new V()),cargo<35?0x3a3a38:0x7a7a76)}
    const left=Math.max(0,Math.round(GOAL-cs));$('dist').textContent='距離前線陣地 '+left+' 公尺';$('prog').style.width=(prog*100)+'%';
    const jl=Math.max(0,jamReady-clock);$('jam').disabled=jl>0||!live;$('jamT').textContent=jl>0?'充電中 '+Math.ceil(jl)+' 秒':'準備好了';$('jamCd').style.width=(jl>0?(1-jl/L.jamCd)*100:0)+'%';
    if(live&&warnT<=0){const lockedNear=DR.some(d=>d.state==='fly'&&!d.safe&&d.locked&&Math.abs(d.x-cx)<1.9),aim=DR.some(d=>d.state==='fly'&&!d.safe&&!d.locked);
      const artNear=ART.some(a=>!a.done&&Math.abs(a.x-cx)<2.3&&a.sI-cs<60);const kAhead=kAt(cs+45);
      if(lockedNear){$('warn').textContent='閃開！';$('warn').className='hud red'}
      else if(artNear){$('warn').textContent='砲擊！離開大圈';$('warn').className='hud red'}
      else if(inTunnel(cs)){$('warn').textContent='';}
      else if(inNet(cs)){$('warn').textContent='防護網路段';$('warn').className='hud grn'}
      else if(aim){$('warn').textContent='無人機正在瞄準';$('warn').className='hud amb'}
      else if(Math.abs(kAhead)>.004){$('warn').textContent=kAhead>0?'前方右彎':'前方左彎';$('warn').className='hud amb'}
      else $('warn').textContent=''}
    warnT-=dt;
  }else{stepDrones(0,now()/1000)}
  stepFX(dt);stepRain(dt,car.position.x,car.position.z);
  const port=innerHeight>innerWidth;const back=port?13.5:11,up=port?6.2:5.3,upT=Math.min(up,5.6);
  const hNow=at(cs-6).h;camH+=(hNow-camH)*Math.min(1,dt*4);
  const fx=Math.sin(camH),fz=-Math.cos(camH);
  cam.position.set(car.position.x-fx*back,up+(upT-up)*tunF-.9*tunF,car.position.z-fz*back);
  if(shake>0){shake-=dt;cam.position.x+=rnd(-1,1)*shake*.5;cam.position.y+=rnd(-1,1)*shake*.4}
  toW(cx*.75,.8,cs+24,tmp);cam.lookAt(tmp);
  sun.position.set(car.position.x+20,40,car.position.z+25);sun.target.position.set(car.position.x,0,car.position.z-10);
}
const MK=[];const pv=new V();
function updMarks(w,h){let k=0;for(const d of DR){if(d.state!=='fly')continue;pv.copy(d.g.position).project(cam);if(pv.z>1||pv.x<-1.1||pv.x>1.1||pv.y<-1.1||pv.y>1.1)continue;
  let m=MK[k];if(!m){m=document.createElement('div');$('marks').appendChild(m);MK.push(m)}m.className='mk'+(d.fiber?' fb':'');m.dataset.l=d.fiber?'光纖無人機':'無人機';m.style.display='block';m.style.left=((pv.x+1)/2*w)+'px';m.style.top=((1-pv.y)/2*h)+'px';k++}
  for(;k<MK.length;k++)MK[k].style.display='none'}
function render(){const w=$('wrap').clientWidth,h=$('wrap').clientHeight;if(R.domElement.width!==Math.round(w*R.getPixelRatio())||R.domElement.height!==Math.round(h*R.getPixelRatio())){R.setSize(w,h,false);cam.aspect=w/h;cam.fov=h>w?72:55;cam.updateProjectionMatrix()}R.render(S,cam);updMarks(w,h)}

/* ---------- 介面 ---------- */
function openCard(html){$('card').innerHTML=html;$('ov').hidden=false;const b=$('card').querySelector('button');b&&b.focus()}
function closeCard(){$('ov').hidden=true}
$('card').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='go'||a==='retry'){closeCard();startRun()}
  else if(a==='menu')menu();
  else if(a==='resume'){closeCard();state='play';last=performance.now()}});
function menu(){state='menu';DR.slice().forEach(killDrone);DR.length=0;$('warn').textContent='';$('seg').hidden=true;
  openCard(`<div class="tag">全民國防　課堂遊戲</div><h1>補給公路</h1><p>開著補給車，從後方一路開到前線陣地：穿過市區、曠野、橋和隧道，全程大約三分鐘。路上會有無人機俯衝、砲彈落下，盡量把補給完整送到。</p>
  <ol class="how"><li>按住畫面下方的「左」「右」換車道（電腦用方向鍵）。</li><li>地上的<b style="color:var(--amber)">黃圈</b>：無人機正在瞄準你；變成<b style="color:var(--red)">紅圈</b>就是鎖定了，馬上閃開。</li><li>地上出現<b style="color:#ff7a3d">橘色大圈</b>：砲擊要來了，開到沒有圈的那條車道。</li><li>「干擾器」能讓無線電無人機失控，但對光纖無人機和砲彈都沒用（電腦用空白鍵）。</li><li>過彎時車子會被甩向外側，要往內側修正。</li><li>每被打中一次，補給就少一些；車子會一直開到終點。</li></ol>
  <div class="btns"><button class="btn" type="button" data-a="go">出發</button></div>
  ${best!=null?`<p class="mut">你的最佳成績：送達 ${best}% 的補給</p>`:''}
  <p class="mut">手機橫放玩，視野比較寬。車輛、無人機與場景都是原創電玩造型；沒有聲音、不見血。</p>`)}
function grade(c){return c>=85?['幾乎完整送達','前線拿到了需要的東西。']:c>=60?['送到大半','前線撐得下去，但有些東西沒送到。']:c>=30?['只剩一半不到','這趟路的損失，前線會感受到。']:['補給幾乎全毀','車子開到了，但車上已經沒剩多少。']}
function result(){state='result';const c=Math.round(cargo);if(best==null||c>best){best=c;saveBest()}
  const g=grade(c),m=Math.floor(clock/60),sec=Math.round(clock%60);
  const know=(k)=>`<div class="know"><b>真實世界・${k.h}</b><p>${k.t}</p><a href="${k.u}" target="_blank" rel="noopener">${k.s}</a></div>`;
  openCard(`<div class="tag">抵達前線陣地</div><h2>送達 ${c}% 的補給：${g[0]}</h2><p>${g[1]}　全程 ${m} 分 ${sec} 秒。</p>
  <div class="stats"><div><span>閃過無人機</span><b>${stat.dodge} 架</b></div><div><span>干擾失控</span><b>${stat.jam} 架</b></div><div><span>被網攔下</span><b>${stat.net} 架</b></div><div><span>躲過砲彈</span><b>${stat.artDodge} 發</b></div></div>
  <p class="mut">被無人機擊中 ${stat.hd} 次、被砲彈波及 ${stat.ha} 次、撞上路障 ${stat.ho} 次、擦撞路邊 ${stat.scrape} 次。</p>
  <div class="lesson">一路上，對手換了好幾種招式：無線電無人機可以干擾，光纖無人機就不行；防護網擋得住無人機，擋不住砲彈；只有隧道什麼都擋得住。前線的補給車沒有安全的路，補給線本身就是戰場。</div>
  <div class="btns"><button class="btn" type="button" data-a="retry">再跑一次</button><button class="btn dark" type="button" data-a="menu">回選單</button></div>
  ${NEWS.map(know).join('')}`)}
$('pauseB').onclick=()=>{if(state!=='play')return;state='pause';openCard(`<h2>暫停</h2><div class="btns"><button class="btn" type="button" data-a="resume">繼續</button><button class="btn dark" type="button" data-a="retry">從頭再來</button><button class="btn dark" type="button" data-a="menu">回選單</button></div>`)};
$('jam').onclick=jam;
function hold(el,dir){const on=e=>{e.preventDefault();steer=dir;el.classList.add('on')},off=e=>{if(steer===dir)steer=0;el.classList.remove('on')};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);el.addEventListener('contextmenu',e=>e.preventDefault())}
hold($('bL'),-1);hold($('bR'),1);
const keys={};addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a'){keys.l=1;steer=-1}if(e.key==='ArrowRight'||e.key==='d'){keys.r=1;steer=1}if(e.key===' '){jam();e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'){keys.l=0;steer=keys.r?1:0}if(e.key==='ArrowRight'||e.key==='d'){keys.r=0;steer=keys.l?-1:0}});
document.addEventListener('gesturestart',e=>e.preventDefault());
window.__road={get OBS(){return OBS},get ART(){return ART},get state(){return state},get DR(){return DR},get car(){return car},get cs(){return cs},get cx(){return cx},get cargo(){return cargo},get clock(){return clock},kAt,get stat(){return stat},setSteer:v=>{steer=v},jam,startRun,step,GOAL};
menu();requestAnimationFrame(frame);
})();
</script>
